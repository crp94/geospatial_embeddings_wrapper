name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[raster,reports]"
      - name: Package and syntax checks
        run: |
          python -m pip check
          python -m compileall -q scripts reporting wrappers tests
      - name: Run offline test suite
        env:
          MPLBACKEND: Agg
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
